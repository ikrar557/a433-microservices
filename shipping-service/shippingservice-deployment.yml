apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
  namespace: deployments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shippingservice
  template:
    metadata:
      labels:
        app: shippingservice
    spec:
      containers:
      - name: shippingservice
        image: ghcr.io/ikrar557/shippingservice:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: AMQP_URL
          value: "amqp://rabbitmq.communications.svc.cluster.local:5672"