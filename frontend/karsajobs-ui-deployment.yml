apiVersion: apps/v1
kind: Deployment
metadata:
  name: karsajobs-ui
  namespace: deployments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karsajobs-ui
  template:
    metadata:
      labels:
        app: karsajobs-ui
    spec:
      containers:
      - name: karsajobs-ui
        env:
        - name: VUE_APP_BACKEND
          value: "http://localhost:30081"
        image: ghcr.io/ikrar557/karsajobs-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "500m"