version: 2.1    # Menentukan versi CircleCI yang digunakan

jobs:    # Mendefinisikan pekerjaan yang akan dijalankan
  lint-dockerfile:    # Job untuk melakukan linting pada Dockerfile
    docker:    # Menentukan image Docker yang digunakan
      - image: ubuntu:latest    # Menggunakan image Ubuntu versi terbaru
    steps:    # Langkah-langkah yang akan dijalankan
      - checkout    # Mengambil kode dari repository
      - run:    # Menjalankan perintah
          name: Install dependencies    # Nama langkah untuk instalasi dependensi
          command: |    # Perintah yang akan dijalankan
            apt-get update    # Memperbarui package list
            apt-get install -y wget    # Menginstall wget
      - run:    # Menjalankan perintah kedua
          name: Install Hadolint    # Nama langkah untuk instalasi Hadolint
          command: |    # Perintah yang akan dijalankan
            wget -O /bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64    # Mengunduh Hadolint
            chmod +x /bin/hadolint    # Memberikan izin eksekusi
      - run:    # Menjalankan perintah linting
          name: Lint Dockerfile    # Nama langkah untuk linting
          command: hadolint Dockerfile    # Menjalankan Hadolint pada Dockerfile

  test-app:    # Job untuk menjalankan pengujian aplikasi
    docker:    # Menentukan image Docker yang digunakan
      - image: cimg/go:1.19    # Menggunakan image Go versi 1.19
    steps:    # Langkah-langkah yang akan dijalankan
      - checkout    # Mengambil kode dari repository
      - run:    # Menjalankan perintah pengujian
          name: Run Tests    # Nama langkah untuk menjalankan test
          command: go test -v -short --count=1 $(go list ./...)    # Menjalankan semua test Go

  build-app-karsajobs:    # Job untuk membangun dan mendorong image
    docker:    # Menentukan image Docker yang digunakan
      - image: cimg/go:1.19    # Menggunakan image Go versi 1.19
    steps:    # Langkah-langkah yang akan dijalankan
      - checkout    # Mengambil kode dari repository
      - setup_remote_docker    # Menyiapkan Docker untuk build
      - run:    # Menjalankan perintah build dan push
          name: Build and Push Image    # Nama langkah untuk build dan push
          command: |    # Perintah yang dijalankan
            docker build -t ghcr.io/${GITHUB_USERNAME}/karsajobs:latest .    # Membangun image Docker
            echo $GITHUB_TOKEN | docker login ghcr.io -u ${GITHUB_USERNAME} --password-stdin    # Login ke GitHub Container Registry
            docker push ghcr.io/${GITHUB_USERNAME}/karsajobs:latest    # Mendorong image ke registry

workflows:    # Mendefinisikan alur kerja
  version: 2    # Versi workflow
  backend-pipeline:    # Nama pipeline untuk backend
    jobs:    # Daftar job yang dijalankan
      - lint-dockerfile    # Menjalankan job lint-dockerfile
      - test-app:    # Menjalankan job test-app
          requires:    # Menentukan ketergantungan
            - lint-dockerfile    # Harus menunggu lint-dockerfile selesai
      - build-app-karsajobs:    # Menjalankan job build-app-karsajobs
          requires:    # Menentukan ketergantungan
            - test-app    # Harus menunggu test-app selesai
          context: github-credentials    # Menggunakan kredensial GitHub yang sudah dibuat sebelumnya